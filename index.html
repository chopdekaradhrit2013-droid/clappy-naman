<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clappy Naman</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 750px;
    background: #0d1b0d;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    background: linear-gradient(180deg, #0d1b0d 0%, #1a2f1a 60%, #0f1f0f 100%);
    color: #fff;
    padding: 20px;
    pointer-events: auto;
  }
  .screen.active { display: flex; }
  .title {
    font-size: 32px;
    letter-spacing: 3px;
    text-shadow: 4px 4px 0 #000;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 14px;
    color: #ffd700;
    margin-bottom: 28px;
    letter-spacing: 1px;
  }
  .input-group {
    width: 100%;
    max-width: 280px;
    margin-bottom: 14px;
  }
  .input-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: #a0d0a0;
  }
  .input-group input {
    width: 100%;
    padding: 12px 14px;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    background: #142814;
    border: 3px solid #2ecc40;
    border-radius: 8px;
    color: #fff;
    outline: none;
  }
  .input-group input:focus { border-color: #5ce06a; }
  .btn {
    width: 100%;
    max-width: 280px;
    padding: 14px;
    margin-top: 10px;
    font-family: 'Courier New', monospace;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #fff;
    background: #1a8f2a;
    border: 3px solid #0d5c18;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 1px 1px 0 #000;
  }
  .btn:active { transform: scale(0.97); background: #157a22; }
  .btn.secondary {
    background: #1a3a5c;
    border-color: #0d2a4a;
  }
  .btn.secondary:active { background: #152e4a; }
  .link-btn {
    margin-top: 18px;
    background: none;
    border: none;
    color: #5ce06a;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    cursor: pointer;
    text-decoration: underline;
    padding: 10px 16px;
    pointer-events: auto;
    z-index: 40;
    position: relative;
  }
  .error-msg {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
    text-align: center;
  }
  .welcome {
    font-size: 15px;
    color: #a0d0a0;
    margin-bottom: 30px;
  }
  .welcome span {
    color: #5ce06a;
    font-weight: bold;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  #ui.playing { display: flex; }
  #score {
    margin-top: 36px;
    font-size: 48px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    font-weight: bold;
    letter-spacing: 4px;
  }
  #bestScore {
    margin-top: 4px;
    font-size: 18px;
    color: #ffd700;
    text-shadow: 2px 2px 0 #000;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #message {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    z-index: 20;
    display: none;
    pointer-events: auto;
  }
  #message h1 {
    font-size: 42px;
    text-shadow: 4px 4px 0 #000;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  #message p {
    font-size: 16px;
    text-shadow: 2px 2px 0 #000;
    margin: 4px 0;
  }
  #finalScore { font-size: 22px !important; }
  #finalBest { font-size: 20px !important; color: #ffd700; }
  .lb-btn {
    margin-top: 14px;
    padding: 10px 20px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    background: #1a8f2a;
    border: 3px solid #0d5c18;
    border-radius: 6px;
    cursor: pointer;
    pointer-events: auto;
  }
  .lb-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    pointer-events: auto;
  }
  .lb-overlay.show { display: flex; }
  .lb-panel {
    width: 88%;
    max-width: 340px;
    background: #0d1b0d;
    border: 4px solid #2ecc40;
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
  }
  .lb-panel h2 {
    font-size: 26px;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #000;
    margin-bottom: 4px;
  }
  .lb-sub {
    font-size: 13px;
    color: #ffd700;
    margin-bottom: 16px;
  }
  .lb-list {
    text-align: left;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    margin-bottom: 6px;
    background: #142814;
    border-radius: 6px;
    border: 1px solid #1a3a1a;
    font-size: 14px;
  }
  .lb-rank { width: 30px; color: #ffd700; font-weight: bold; }
  .lb-name { flex: 1; padding-left: 6px; }
  .lb-name.you { color: #5ce06a; font-weight: bold; }
  .lb-score { font-weight: bold; }
  .lb-empty {
    text-align: center;
    padding: 40px 10px;
    color: #777;
    font-size: 15px;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>

  <div id="authScreen" class="screen active">
    <div class="title">CLAPPY NAMAN</div>
    <div class="subtitle" id="authSubtitle">SIGN IN</div>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="authUser" placeholder="Enter username" maxlength="16" autocomplete="username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="authPass" placeholder="Enter password" maxlength="24" autocomplete="current-password">
    </div>
    <button class="btn" id="authSubmitBtn">SIGN IN</button>
    <div class="error-msg" id="authError"></div>
    <button class="link-btn" id="authToggle">Don't have an account? Sign Up</button>
  </div>

  <div id="homeScreen" class="screen">
    <div class="title">CLAPPY NAMAN</div>
    <div class="welcome">Welcome, <span id="homeUsername">Player</span></div>
    <button class="btn" id="playBtn" style="margin-bottom:12px">▶  PLAY</button>
    <button class="btn secondary" id="homeLbBtn">🏆  LEADERBOARD</button>
    <button class="link-btn" id="logoutBtn" style="margin-top:28px">Log out</button>
  </div>

  <div id="ui">
    <div id="score">000</div>
    <div id="bestScore">BEST 000</div>
    <div id="message">
      <h1>GAME OVER</h1>
      <p id="finalScore">SCORE 000</p>
      <p id="finalBest">BEST 000</p>
      <button class="lb-btn" id="gameLbBtn">LEADERBOARD</button>
      <p style="margin-top:14px;font-size:14px;opacity:0.85">TAP TO RESTART</p>
    </div>
  </div>

  <div id="leaderboard" class="lb-overlay">
    <div class="lb-panel">
      <h2>LEADERBOARD</h2>
      <p class="lb-sub">TOP 10 PLAYERS</p>
      <div id="lbList" class="lb-list"></div>
      <button class="btn" id="lbClose" style="max-width:160px;margin:0 auto;display:block">CLOSE</button>
    </div>
  </div>
</div>

<script>
const USERS_KEY = 'clappyUsers';
const CURRENT_USER_KEY = 'clappyCurrentUser';
function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch { return {}; } }
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function getCurrentUser() { return localStorage.getItem(CURRENT_USER_KEY); }
function setCurrentUser(name) { if (name) localStorage.setItem(CURRENT_USER_KEY, name); else localStorage.removeItem(CURRENT_USER_KEY); }

let isSignUpMode = false;
const authScreen = document.getElementById('authScreen');
const homeScreen = document.getElementById('homeScreen');
const authSubtitle = document.getElementById('authSubtitle');
const authUser = document.getElementById('authUser');
const authPass = document.getElementById('authPass');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authToggle = document.getElementById('authToggle');
const authError = document.getElementById('authError');
const homeUsername = document.getElementById('homeUsername');

function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
  document.getElementById('ui').classList.remove('playing');
  document.getElementById('message').style.display = 'none';
}

function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  authError.textContent = '';
  authPass.value = '';
  if (isSignUpMode) {
    authSubtitle.textContent = 'SIGN UP';
    authSubmitBtn.textContent = 'CREATE ACCOUNT';
    authToggle.textContent = 'Already have an account? Sign In';
  } else {
    authSubtitle.textContent = 'SIGN IN';
    authSubmitBtn.textContent = 'SIGN IN';
    authToggle.textContent = "Don't have an account? Sign Up";
  }
}

authToggle.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleAuthMode(); });
authToggle.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); toggleAuthMode(); });

authSubmitBtn.addEventListener('click', () => {
  const username = authUser.value.trim();
  const password = authPass.value;
  if (!username || username.length < 2) { authError.textContent = 'Username must be at least 2 characters'; return; }
  if (!password || password.length < 3) { authError.textContent = 'Password must be at least 3 characters'; return; }
  const users = getUsers();
  if (isSignUpMode) {
    if (users[username]) { authError.textContent = 'Username already taken'; return; }
    users[username] = password;
    saveUsers(users);
    setCurrentUser(username);
    goHome();
  } else {
    if (!users[username] || users[username] !== password) { authError.textContent = 'Wrong username or password'; return; }
    setCurrentUser(username);
    goHome();
  }
});

authPass.addEventListener('keydown', e => { if (e.key === 'Enter') authSubmitBtn.click(); });
authUser.addEventListener('keydown', e => { if (e.key === 'Enter') authPass.focus(); });

function goHome() {
  const user = getCurrentUser();
  if (!user) { showScreen(authScreen); return; }
  homeUsername.textContent = user;
  showScreen(homeScreen);
  window.MY_USERNAME = user;
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  setCurrentUser(null);
  authUser.value = ''; authPass.value = ''; authError.textContent = '';
  isSignUpMode = false;
  authSubtitle.textContent = 'SIGN IN';
  authSubmitBtn.textContent = 'SIGN IN';
  authToggle.textContent = "Don't have an account? Sign Up";
  showScreen(authScreen);
});

document.getElementById('playBtn').addEventListener('click', () => { startGame(); });
document.getElementById('homeLbBtn').addEventListener('click', () => { openLeaderboard(); });
document.getElementById('gameLbBtn').addEventListener('click', (e) => { e.stopPropagation(); openLeaderboard(); });

const lbOverlay = document.getElementById('leaderboard');
const lbList = document.getElementById('lbList');

function getLeaderboard() {
  let players = [
    { name: 'NamanX', score: 47 },
    { name: 'FlappyKing', score: 39 },
    { name: 'PixelRider', score: 31 },
    { name: 'SkyJumper', score: 28 },
    { name: 'PipeDodger', score: 22 },
    { name: 'ClapMaster', score: 19 },
    { name: 'AeroBird', score: 15 },
    { name: 'GreenWing', score: 12 },
    { name: 'TapHero', score: 9 }
  ];
  const user = getCurrentUser() || 'Player';
  const myBest = parseInt(localStorage.getItem('clappyNamanBest_' + user) || localStorage.getItem('clappyNamanBest') || '0', 10);
  if (myBest > 0) {
    players = players.filter(p => p.name !== user);
    players.push({ name: user, score: myBest });
  }
  players.sort((a, b) => b.score - a.score);
  return players.slice(0, 10);
}

function renderLeaderboard() {
  const players = getLeaderboard();
  const user = getCurrentUser() || '';
  lbList.innerHTML = '';
  if (players.length === 0) {
    lbList.innerHTML = '<div class="lb-empty">No players yet<br><small>Be the first!</small></div>';
    return;
  }
  players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row';
    const isYou = p.name === user;
    row.innerHTML = `<span class="lb-rank">#${i + 1}</span><span class="lb-name ${isYou ? 'you' : ''}">${p.name}${isYou ? ' (You)' : ''}</span><span class="lb-score">${String(p.score).padStart(3, '0')}</span>`;
    lbList.appendChild(row);
  });
}

function openLeaderboard() { renderLeaderboard(); lbOverlay.classList.add('show'); }
function closeLeaderboard() { lbOverlay.classList.remove('show'); }
document.getElementById('lbClose').addEventListener('click', closeLeaderboard);
lbOverlay.addEventListener('click', (e) => { if (e.target === lbOverlay) closeLeaderboard(); });

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestScoreEl = document.getElementById('bestScore');
const messageEl = document.getElementById('message');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const uiEl = document.getElementById('ui');

const birdImg = new Image();
birdImg.src = 'bird.png';

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type = 'square', volume = 0.15, slideTo = null) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playFlap() { playTone(380, 0.09, 'square', 0.12, 620); }
function playScore() { playTone(880, 0.08, 'square', 0.14); setTimeout(() => playTone(1175, 0.12, 'square', 0.1), 70); }
function playHit() { playTone(120, 0.25, 'sawtooth', 0.2, 40); playTone(90, 0.35, 'square', 0.12, 30); }

let W, H, scale;
const GRAVITY = 0.45, FLAP = -8.2, PIPE_WIDTH = 70, PIPE_GAP = 165, PIPE_SPEED = 2.8, GROUND_H = 70;
let bird, pipes, score, best = 0, state, frame = 0, groundOffset = 0, gameRunning = false;

function loadBest() {
  const user = getCurrentUser() || 'guest';
  const saved = localStorage.getItem('clappyNamanBest_' + user) || localStorage.getItem('clappyNamanBest');
  best = saved ? parseInt(saved, 10) || 0 : 0;
  bestScoreEl.textContent = 'BEST ' + String(best).padStart(3, '0');
}
function saveBest() {
  const user = getCurrentUser() || 'guest';
  localStorage.setItem('clappyNamanBest_' + user, best);
  localStorage.setItem('clappyNamanBest', best);
}

function resize() {
  const container = document.getElementById('gameContainer');
  const rect = container.getBoundingClientRect();
  W = Math.floor(rect.width); H = Math.floor(rect.height);
  canvas.width = W; canvas.height = H;
  scale = Math.min(W / 360, H / 640);
}
window.addEventListener('resize', resize);
resize();

function reset() {
  bird = { x: W * 0.28, y: H * 0.42, vy: 0, rot: 0, w: 48 * scale, h: 60 * scale };
  pipes = []; score = 0; frame = 0; groundOffset = 0; state = 'ready';
  scoreEl.textContent = '000'; loadBest(); messageEl.style.display = 'none';
  spawnPipe(); spawnPipe(true);
}
function spawnPipe(initial = false) {
  const minY = 100 * scale;
  const maxY = H - GROUND_H - PIPE_GAP - 80 * scale;
  const gapY = minY + Math.random() * (maxY - minY);
  const x = initial ? W + 180 * scale : (pipes.length ? pipes[pipes.length-1].x + 220 * scale : W + 50);
  pipes.push({ x, gapY, passed: false });
}
function flap() {
  if (!gameRunning) return;
  if (state === 'ready') { state = 'playing'; playFlap(); }
  else if (state === 'playing') { bird.vy = FLAP; playFlap(); }
  else if (state === 'over') { reset(); }
}
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive: false});
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });

function update() {
  if (state !== 'playing') return;
  frame++; bird.vy += GRAVITY; bird.y += bird.vy;
  bird.rot = Math.min(Math.PI / 2.2, Math.max(-0.6, bird.vy * 0.08));
  for (let p of pipes) p.x -= PIPE_SPEED * scale;
  if (pipes[0] && pipes[0].x < -PIPE_WIDTH * scale - 20) pipes.shift();
  if (pipes[pipes.length-1].x < W - 180 * scale) spawnPipe();
  for (let p of pipes) {
    if (!p.passed && p.x + PIPE_WIDTH * scale < bird.x) {
      p.passed = true; score++; scoreEl.textContent = String(score).padStart(3, '0'); playScore();
    }
  }
  const bw = bird.w * 0.55, bh = bird.h * 0.55, bx = bird.x - bw/2, by = bird.y - bh/2;
  if (bird.y + bh/2 > H - GROUND_H || bird.y - bh/2 < 0) { gameOver(); return; }
  for (let p of pipes) {
    const px = p.x, pw = PIPE_WIDTH * scale, topH = p.gapY, botY = p.gapY + PIPE_GAP;
    if (bx + bw > px && bx < px + pw && by < topH) { gameOver(); return; }
    if (bx + bw > px && bx < px + pw && by + bh > botY) { gameOver(); return; }
  }
  groundOffset = (groundOffset + PIPE_SPEED * scale) % 40;
}
function gameOver() {
  if (state === 'over') return;
  state = 'over'; playHit();
  if (score > best) { best = score; saveBest(); }
  bestScoreEl.textContent = 'BEST ' + String(best).padStart(3, '0');
  finalScoreEl.textContent = 'SCORE ' + String(score).padStart(3, '0');
  finalBestEl.textContent = 'BEST ' + String(best).padStart(3, '0');
  messageEl.style.display = 'block';
}
function drawPipe(x, gapY) {
  const pw = PIPE_WIDTH * scale, green = '#2ecc40', darkGreen = '#1a8f2a', lightGreen = '#5ce06a', lipH = 28 * scale;
  ctx.fillStyle = green; ctx.fillRect(x, 0, pw, gapY - lipH);
  ctx.fillStyle = lightGreen; ctx.fillRect(x - 6*scale, gapY - lipH, pw + 12*scale, lipH);
  ctx.fillStyle = darkGreen; ctx.fillRect(x - 6*scale, gapY - 6*scale, pw + 12*scale, 6*scale);
  const botY = gapY + PIPE_GAP;
  ctx.fillStyle = green; ctx.fillRect(x, botY + lipH, pw, H - GROUND_H - botY - lipH);
  ctx.fillStyle = lightGreen; ctx.fillRect(x - 6*scale, botY, pw + 12*scale, lipH);
  ctx.fillStyle = darkGreen; ctx.fillRect(x - 6*scale, botY, pw + 12*scale, 6*scale);
  ctx.strokeStyle = '#0d5c18'; ctx.lineWidth = 2 * scale;
  ctx.strokeRect(x + 1, 1, pw - 2, gapY - lipH - 1);
  ctx.strokeRect(x + 1, botY + lipH, pw - 2, H - GROUND_H - botY - lipH - 1);
}
function drawGround() {
  ctx.fillStyle = '#3d2314'; ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#2d8f1e'; ctx.fillRect(0, H - GROUND_H, W, 14 * scale);
  ctx.fillStyle = '#5c3a1e';
  for (let i = -1; i < W / 20 + 2; i++) {
    const ox = (i * 20 - groundOffset) % (W + 40);
    ctx.fillRect(ox, H - GROUND_H + 18 * scale, 12 * scale, 8 * scale);
    ctx.fillRect(ox + 8 * scale, H - GROUND_H + 32 * scale, 10 * scale, 6 * scale);
  }
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0, H - GROUND_H, W, 3 * scale);
}
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1b0d'); grad.addColorStop(0.6, '#1a2f1a'); grad.addColorStop(1, '#0f1f0f');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H - GROUND_H);
  ctx.fillStyle = '#142814'; ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H - 40 * scale);
  for (let i = 0; i <= 6; i++) {
    const hx = (i / 6) * W;
    const hy = H - GROUND_H - (30 + Math.sin(i * 1.7 + frame * 0.01) * 15) * scale;
    ctx.lineTo(hx, hy);
  }
  ctx.lineTo(W, H - GROUND_H); ctx.lineTo(0, H - GROUND_H); ctx.fill();
}
function drawBird() {
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
  if (birdImg.complete && birdImg.naturalWidth > 0) {
    ctx.drawImage(birdImg, -bird.w/2, -bird.h/2, bird.w, bird.h);
  } else {
    ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(0, 0, bird.w/2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function draw() {
  if (!gameRunning) return;
  drawBackground();
  for (let p of pipes) drawPipe(p.x, p.gapY);
  drawGround(); drawBird();
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
function startGame() {
  homeScreen.classList.remove('active');
  authScreen.classList.remove('active');
  uiEl.classList.add('playing');
  gameRunning = true; loadBest(); reset();
}
if (getCurrentUser()) goHome(); else showScreen(authScreen);
birdImg.onload = () => { loop(); };
if (birdImg.complete) loop(); else setTimeout(loop, 500);
</script>
