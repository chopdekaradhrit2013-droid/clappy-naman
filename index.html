<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clappy Naman</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 750px;
    background: #1a1a1a;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #score {
    margin-top: 36px;
    font-size: 48px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    font-weight: bold;
    letter-spacing: 4px;
    z-index: 10;
  }
  #bestScore {
    margin-top: 4px;
    font-size: 18px;
    color: #ffd700;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    font-weight: bold;
    letter-spacing: 2px;
    z-index: 10;
  }
  #message {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    z-index: 20;
    display: none;
  }
  #message h1 {
    font-size: 42px;
    text-shadow: 4px 4px 0 #000;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  #message p {
    font-size: 16px;
    text-shadow: 2px 2px 0 #000;
    opacity: 0.9;
    margin: 4px 0;
  }
  #finalScore {
    font-size: 22px !important;
    color: #fff;
    margin-top: 8px !important;
  }
  #finalBest {
    font-size: 20px !important;
    color: #ffd700;
  }
  #startMsg {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    z-index: 15;
    text-shadow: 3px 3px 0 #000;
  }
  #startMsg h2 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  #startMsg p {
    font-size: 14px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="score">000</div>
    <div id="bestScore">BEST 000</div>
    <div id="startMsg">
      <h2>CLAPPY NAMAN</h2>
      <p>TAP / CLICK / SPACE<br>to flap</p>
    </div>
    <div id="message">
      <h1>GAME OVER</h1>
      <p id="finalScore">SCORE 000</p>
      <p id="finalBest">BEST 000</p>
      <p style="margin-top:12px">PRESS ANYWHERE TO RESTART</p>
    </div>
  </div>
</div>

// ===== Sound Effects (Web Audio API - no external files needed) =====
let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, duration, type = 'square', volume = 0.15, slideTo = null) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
    }
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function playFlap() {
  // Quick rising chirp
  playTone(380, 0.09, 'square', 0.12, 620);
}

function playScore() {
  // Bright coin ping
  playTone(880, 0.08, 'square', 0.14);
  setTimeout(() => playTone(1175, 0.12, 'square', 0.1), 70);
}

function playHit() {
  // Low thud + noise-ish fall
  playTone(120, 0.25, 'sawtooth', 0.2, 40);
  playTone(90, 0.35, 'square', 0.12, 30);
}

// Game constants (tuned for mobile feel)
let W, H, scale;
const GRAVITY = 0.45;
const FLAP = -8.2;
const PIPE_WIDTH = 70;
const PIPE_GAP = 165;
const PIPE_SPEED = 2.8;
const GROUND_H = 70;

let bird, pipes, score, best = 0, state; // 'ready' | 'playing' | 'over'
let frame = 0;
let groundOffset = 0;

// High score "backend" using localStorage (persists on this device)
function loadBest() {
  const saved = localStorage.getItem('clappyNamanBest');
  best = saved ? parseInt(saved, 10) || 0 : 0;
  updateBestDisplay();
}
function saveBest() {
  localStorage.setItem('clappyNamanBest', best);
}
function updateBestDisplay() {
  bestScoreEl.textContent = 'BEST ' + String(best).padStart(3, '0');
}

function resize() {
  const container = document.getElementById('gameContainer');
  const rect = container.getBoundingClientRect();
  W = Math.floor(rect.width);
  H = Math.floor(rect.height);
  canvas.width = W;
  canvas.height = H;
  scale = Math.min(W / 360, H / 640);
}

window.addEventListener('resize', resize);
resize();

function reset() {
  bird = {
    x: W * 0.28,
    y: H * 0.42,
    vy: 0,
    rot: 0,
    w: 48 * scale,
    h: 60 * scale
  };
  pipes = [];
  score = 0;
  frame = 0;
  groundOffset = 0;
  state = 'ready';
  scoreEl.textContent = '000';
  updateBestDisplay();
  messageEl.style.display = 'none';
  startMsgEl.style.display = 'block';
  spawnPipe();
  spawnPipe(true);
}

function spawnPipe(initial = false) {
  const minY = 100 * scale;
  const maxY = H - GROUND_H - PIPE_GAP - 80 * scale;
  const gapY = minY + Math.random() * (maxY - minY);
  const x = initial ? W + 180 * scale : (pipes.length ? pipes[pipes.length-1].x + 220 * scale : W + 50);
  pipes.push({
    x: x,
    gapY: gapY,
    passed: false
  });
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    startMsgEl.style.display = 'none';
    playFlap();
  } else if (state === 'playing') {
    bird.vy = FLAP;
    playFlap();
  } else if (state === 'over') {
    reset();
  }
}

// Input
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive: false});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});

function update() {
  if (state !== 'playing') return;

  frame++;
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.min(Math.PI / 2.2, Math.max(-0.6, bird.vy * 0.08));

  // Move pipes
  for (let p of pipes) {
    p.x -= PIPE_SPEED * scale;
  }

  // Remove offscreen + spawn new
  if (pipes[0] && pipes[0].x < -PIPE_WIDTH * scale - 20) {
    pipes.shift();
  }
  if (pipes[pipes.length-1].x < W - 180 * scale) {
    spawnPipe();
  }

  // Score
  for (let p of pipes) {
    if (!p.passed && p.x + PIPE_WIDTH * scale < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = String(score).padStart(3, '0');
      playScore();
    }
  }

  // Collisions
  const bw = bird.w * 0.55;
  const bh = bird.h * 0.55;
  const bx = bird.x - bw/2;
  const by = bird.y - bh/2;

  // Ground / ceiling
  if (bird.y + bh/2 > H - GROUND_H || bird.y - bh/2 < 0) {
    gameOver();
    return;
  }

  // Pipes
  for (let p of pipes) {
    const px = p.x;
    const pw = PIPE_WIDTH * scale;
    const topH = p.gapY;
    const botY = p.gapY + PIPE_GAP;

    // Top pipe
    if (bx + bw > px && bx < px + pw && by < topH) {
      gameOver();
      return;
    }
    // Bottom pipe
    if (bx + bw > px && bx < px + pw && by + bh > botY) {
      gameOver();
      return;
    }
  }

  groundOffset = (groundOffset + PIPE_SPEED * scale) % 40;
}

function gameOver() {
  if (state === 'over') return; // prevent multiple triggers
  state = 'over';
  playHit();
  if (score > best) {
    best = score;
    saveBest();
  }
  updateBestDisplay();
  finalScoreEl.textContent = 'SCORE ' + String(score).padStart(3, '0');
  finalBestEl.textContent = 'BEST ' + String(best).padStart(3, '0');
  messageEl.style.display = 'block';
}

function drawPipe(x, gapY) {
  const pw = PIPE_WIDTH * scale;
  const r = 8 * scale; // corner radius feel

  // Colors matching reference
  const green = '#2ecc40';
  const darkGreen = '#1a8f2a';
  const lightGreen = '#5ce06a';
  const lipH = 28 * scale;

  // Top pipe body
  ctx.fillStyle = green;
  ctx.fillRect(x, 0, pw, gapY - lipH);
  // Top lip
  ctx.fillStyle = lightGreen;
  ctx.fillRect(x - 6*scale, gapY - lipH, pw + 12*scale, lipH);
  ctx.fillStyle = darkGreen;
  ctx.fillRect(x - 6*scale, gapY - 6*scale, pw + 12*scale, 6*scale);

  // Bottom pipe
  const botY = gapY + PIPE_GAP;
  ctx.fillStyle = green;
  ctx.fillRect(x, botY + lipH, pw, H - GROUND_H - botY - lipH);
  // Bottom lip
  ctx.fillStyle = lightGreen;
  ctx.fillRect(x - 6*scale, botY, pw + 12*scale, lipH);
  ctx.fillStyle = darkGreen;
  ctx.fillRect(x - 6*scale, botY, pw + 12*scale, 6*scale);

  // Pixel edge lines for retro feel
  ctx.strokeStyle = '#0d5c18';
  ctx.lineWidth = 2 * scale;
  ctx.strokeRect(x + 1, 1, pw - 2, gapY - lipH - 1);
  ctx.strokeRect(x + 1, botY + lipH, pw - 2, H - GROUND_H - botY - lipH - 1);
}

function drawGround() {
  // Dirt base
  ctx.fillStyle = '#3d2314';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Grass top strip
  ctx.fillStyle = '#2d8f1e';
  ctx.fillRect(0, H - GROUND_H, W, 14 * scale);

  // Pixel dirt pattern
  ctx.fillStyle = '#5c3a1e';
  for (let i = -1; i < W / 20 + 2; i++) {
    const ox = (i * 20 - groundOffset) % (W + 40);
    ctx.fillRect(ox, H - GROUND_H + 18 * scale, 12 * scale, 8 * scale);
    ctx.fillRect(ox + 8 * scale, H - GROUND_H + 32 * scale, 10 * scale, 6 * scale);
  }

  // Top edge highlight
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, H - GROUND_H, W, 3 * scale);
}

function drawBackground() {
  // Dark sky like reference
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1b0d');
  grad.addColorStop(0.6, '#1a2f1a');
  grad.addColorStop(1, '#0f1f0f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // Subtle pixel hills in background
  ctx.fillStyle = '#142814';
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H - 40 * scale);
  for (let i = 0; i <= 6; i++) {
    const hx = (i / 6) * W;
    const hy = H - GROUND_H - (30 + Math.sin(i * 1.7 + frame * 0.01) * 15) * scale;
    ctx.lineTo(hx, hy);
  }
  ctx.lineTo(W, H - GROUND_H);
  ctx.lineTo(0, H - GROUND_H);
  ctx.fill();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  if (birdImg.complete && birdImg.naturalWidth > 0) {
    // Draw the cutout sprite with outline already baked in
    ctx.drawImage(birdImg, -bird.w/2, -bird.h/2, bird.w, bird.h);
  } else {
    // Fallback circle
    ctx.fillStyle = '#ff9800';
    ctx.beginPath();
    ctx.arc(0, 0, bird.w/2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function draw() {
  drawBackground();

  // Pipes
  for (let p of pipes) {
    drawPipe(p.x, p.gapY);
  }

  drawGround();
  drawBird();

  // Soft vignette for polish
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Start
loadBest(); // load high score from localStorage backend

birdImg.onload = () => {
  reset();
  loop();
};
// In case already loaded
if (birdImg.complete) {
  reset();
  loop();
} else {
  // still start loop so we don't hang
  setTimeout(() => { if (state === undefined) { reset(); loop(); } }, 800);
}
</script>
</body>
</html>
